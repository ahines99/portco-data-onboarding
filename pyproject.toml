[project]
name = "portco-data-onboarding"
version = "0.1.0"
description = "Governed agent for onboarding portfolio-company data into a canonical PE ontology."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp[cli]>=2,<3",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "duckdb>=1.1",
  "sqlglot>=25",
  "jinja2>=3.1",
  "pyyaml>=6",
  "typer>=0.12",
  "httpx>=0.27",
  "anyio>=4.4",
  "structlog>=24.4",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "dbt-core>=1.9,<1.11",
  "dbt-duckdb>=1.9,<1.11",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
llm = ["anthropic>=0.40"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.7",
  "mypy>=1.12",
  "poethepoet>=0.29",
  "pre-commit>=3.8",
  "types-pyyaml",
]

[project.scripts]
portco = "src.cli:app"
portco-mcp = "src.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast, no I/O beyond temp dirs",
  "integration: exercises several layers together",
  "golden: scored against fixture ground truth",
  "eval: evaluation harness cases",
  "slow: invokes dbt or other slow subprocesses",
  "postgres: requires PORTCO_TEST_POSTGRES_URL",
  "security: security enforcement suite",
]
filterwarnings = [
  "ignore::DeprecationWarning:dbt.*",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["var", "tests/snapshots"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "PT", "RUF"]
ignore = [
  "S101",   # assert is fine in tests and invariants
  "S608",   # SQL is built from validated identifiers and then parsed by the SQL guard
  "RUF012", # mutable class defaults on pydantic models are fine
  "S603", "S607", # subprocess calls to dbt are intentional and use fixed argv
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT012", "PT018", "E501"]
"evals/**" = ["S"]
"src/fixtures/**" = ["S311"]  # seeded PRNG for reproducible synthetic data, not crypto

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["src.domain.*", "src.workflows.*", "src.adapters.*"]
strict = true

[tool.poe.tasks]
lint = "ruff check src tests evals scripts"
fmt = "ruff format src tests evals scripts"
typecheck = "mypy src"
test = "pytest -q -m 'not postgres'"
test-golden = "pytest -q -m golden"
test-security = "pytest -q -m security"
eval = "python -m evals.run"
fixtures = "python -m src.cli fixtures generate --fixture all"
migrate = "alembic upgrade head"
demo = "python -m src.cli demo"
schemas = "python scripts/export_schemas.py"
docs = "python scripts/gen_data_contracts.py"
cov-metrics = "pytest -q tests/test_metrics_reference.py --cov=src.domain.metrics_reference --cov-branch --cov-report=term-missing --cov-fail-under=100"

