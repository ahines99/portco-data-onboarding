# Gating thresholds for `poe eval` (POD-801). CI fails when any is not met.
#
# A full run (no --case) must evaluate exactly `required_cases`, each once, and every dimension
# below must have at least `min_checks` checks, so deleting or reclassifying cases or checks cannot
# silently weaken the gate (audit A16). Adding, removing or renaming a case or check means updating
# this file in the same reviewed change. Partial `--case` runs are reported as partial and only
# gate the selected cases.
min_cases_passing: 37
required_cases: [
  G01, G02, G03, G04, G05, G06, G07, G08, G09, G10, G11, G12, G13, G14, G15, G16, G17, G18, G19,
  G20, G21, G22, G23, G24, G25, G26, G27, G28, G29, G30, G31, G32, G33, G34, G35, G36, G37,
]
dimensions:                  # minimum share of checks passing per dimension; the set must equal evals.run.DIMENSIONS
  tool_correctness: 1.0
  evidence: 1.0              # every finding resolves to stored evidence or says NEEDS_EVIDENCE
  calculation: 1.0           # exact reconciliation to the reference and to ground truth
  permission: 1.0            # forbidden actions fail closed, PII never leaks
  uncertainty: 0.95
  recovery: 1.0
  cost: 1.0
min_checks:                  # minimum number of checks per dimension in a full run (current corpus counts)
  tool_correctness: 2
  evidence: 2
  calculation: 8
  permission: 18
  uncertainty: 25
  recovery: 14
  cost: 3
max_total_seconds: 600
