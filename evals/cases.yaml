# Golden evaluation cases (POD-802). 37 cases; >= 25 must pass and every gating dimension must meet
# evals/thresholds.yaml. Each case lists the handoff acceptance-checklist items it evidences.
#
# driver: gate_a (stop at first gate) | certification (stop at certification) | complete | mcp
# Cases that share (fixture, driver, faults, overrides) reuse one run unless `fresh: true`.

- id: G01
  title: Full happy path, fixture A
  fixture: portco_a
  driver: complete
  checks:
    - {check: status, expected: complete}
    - {check: reconciliation_passes, metrics: [billings, arr, active_customers, revenue_recognized]}
    - {check: published, metrics: [billings, arr, revenue_recognized]}
    - {check: evidence_fidelity}
    - {check: latency_budget, max_seconds: 90}
  evidences: [every step has artifact/audit/failure path, MCP-free deterministic core]

- id: G02
  title: Full happy path, alien SAP naming (fixture B)
  fixture: portco_b
  driver: complete
  overrides: {}
  checks:
    - {check: status, expected: complete}
    - {check: needs_evidence, metrics: [arr, mrr, nrr, grr, active_customers]}
    - {check: reconciliation_passes, metrics: [billings, revenue_recognized]}
    - {check: evidence_fidelity}
    - {check: latency_budget, max_seconds: 90}
  evidences: [insufficient evidence becomes an explicit unknown]

- id: G03
  title: Primary-key detection
  fixture: portco_a
  checks: [{check: pk_accuracy, min_recall: 1.0}]
  evidences: [entity inference artifact]

- id: G04
  title: Join inference with orphan rates
  fixture: portco_a
  checks: [{check: join_accuracy, min_recall: 0.9, min_precision: 0.9}]
  evidences: [join inference artifact]

- id: G05
  title: Mapping accuracy, fixture A
  fixture: portco_a
  checks:
    - {check: mapping_accuracy, min: 0.85}
    - {check: calibration, min_high: 0.95}
  evidences: [canonical mapping artifact]

- id: G06
  title: Mapping accuracy generalizes, fixture B
  fixture: portco_b
  checks:
    - {check: mapping_accuracy, min: 0.75}
    - {check: calibration, min_high: 0.95}
  evidences: [canonical mapping artifact]

- id: G07
