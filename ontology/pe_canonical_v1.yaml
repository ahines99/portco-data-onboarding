# Canonical private-equity portfolio-company ontology, v1.
#
# This file is data, not code and not prompt text. The mapper, the dbt generator, the
# semantic-layer generator, the metric reference calculators, and the MCP resource
# `ontology://pe/v1` all read it. Change it through review like any other contract.
version: "1"

entities:
  legal_entity:
    description: A reporting legal entity (company code) inside the portfolio company.
    kind: dimension
    mart: dim_legal_entity
    id_fields: [entity_code]
    table_synonyms: [legal_entities, legal_entity, entities, company_codes, t001]
    fields:
      entity_code: {type: string, required: true, description: Legal entity / company code.}
      entity_name: {type: string, description: Legal entity name.}

  customer:
    description: A paying customer (system of record is billing; CRM accounts enrich it).
    kind: dimension
    mart: dim_customer
    id_fields: [customer_id]
    table_synonyms: [customers, customer, accounts, account, clients, client, debtors, kna1]
    fields:
      customer_id: {type: string, required: true, description: Billing customer identifier.}
      customer_name: {type: string, required: true, description: Customer legal or trading name.}
      crm_account_id: {type: string, description: Identifier of the matching CRM account.}
      industry: {type: string, description: Industry classification.}
      country: {type: string, description: Billing country code.}
      currency: {type: string, description: Billing currency (ISO 4217).}
      billing_email: {type: string, pii: email, description: Billing contact email.}
      owner_email: {type: string, pii: email, description: Internal account owner email.}
      created_date: {type: date, description: Date the customer/account was created.}
      is_deleted: {type: boolean, description: Soft-delete flag.}

  contact:
    description: A person at a customer. Entirely PII except identifiers.
    kind: dimension
    mart: dim_contact
    id_fields: [contact_id]
    table_synonyms: [contacts, contact, people, persons, knvk]
    fields:
      contact_id: {type: string, required: true, description: Contact identifier.}
      crm_account_id: {type: string, description: CRM account the contact belongs to.}
      first_name: {type: string, pii: person_name, description: Given name.}
      last_name: {type: string, pii: person_name, description: Family name.}
      email: {type: string, pii: email, description: Email address.}
      phone: {type: string, pii: phone, description: Phone number.}

  opportunity:
    description: A sales opportunity. Its amount is a BOOKING, never revenue.
    kind: fact
    mart: fct_opportunity
    id_fields: [opportunity_id]
    table_synonyms: [opportunities, opportunity, deals, deal, pipeline]
    fields:
      opportunity_id: {type: string, required: true, description: Opportunity identifier.}
      crm_account_id: {type: string, description: CRM account of the opportunity.}
      amount: {type: decimal, unit: currency_major, description: Booking value of the deal.}
      stage: {type: string, description: Pipeline stage.}
      close_date: {type: date, description: Expected or actual close date.}

  product:
    description: A sellable product or SKU.
    kind: dimension
    mart: dim_product
    id_fields: [sku]
    table_synonyms: [products, product, items, skus, materials, mara]
    fields:
      sku: {type: string, required: true, description: Product / material code.}
      product_name: {type: string, description: Product description.}
      list_price: {type: decimal, unit: currency_major, description: List price.}

  subscription:
    description: A recurring-revenue subscription or contract line, normalized to monthly value.
    kind: fact
    mart: fct_subscription
    id_fields: [subscription_id]
    table_synonyms: [subscriptions, subscription, contracts, contract, recurring_charges]
    fields:
      subscription_id: {type: string, required: true, description: Subscription identifier.}
      customer_id: {type: string, required: true, description: Subscribing customer.}
      plan_code: {type: string, description: Plan or tier code.}
      mrr: {type: decimal, required: true, unit: currency_major, description: Monthly recurring revenue of the subscription.}
      currency: {type: string, required: true, description: Subscription currency.}
      start_date: {type: date, required: true, description: First day the subscription is active.}
      end_date: {type: date, description: Day the subscription ends (exclusive); null if active.}
      status: {type: string, description: Source-system status.}

  invoice:
    description: A customer invoice header (billing document).
    kind: fact
    mart: fct_invoice
    id_fields: [invoice_id]
    table_synonyms: [invoices, invoice, bills, billing_documents, vbrk]
    fields:
      invoice_id: {type: string, required: true, description: Invoice number.}
      customer_id: {type: string, required: true, description: Billed customer.}
      invoice_date: {type: date, required: true, description: Invoice (billing) date.}
      due_date: {type: date, description: Payment due date.}
      total_amount: {type: decimal, required: true, unit: currency_major, description: Invoice total in major currency units.}
      currency: {type: string, required: true, description: Invoice currency.}
      status: {type: string, description: Invoice status.}

  invoice_line:
    description: A line on a customer invoice.
    kind: fact
    mart: fct_invoice_line
    id_fields: [invoice_line_id]
    table_synonyms: [invoice_lines, invoice_line, invoice_items, lines, vbrp]
    fields:
      invoice_line_id: {type: string, required: true, description: Line identifier.}
      invoice_id: {type: string, required: true, description: Parent invoice.}
      sku: {type: string, description: Product code.}
      quantity: {type: integer, description: Quantity billed.}
      unit_price: {type: decimal, unit: currency_major, description: Unit price.}
      amount: {type: decimal, required: true, unit: currency_major, description: Line amount in major currency units.}

  payment:
    description: A cash receipt applied to an invoice.
    kind: fact
    mart: fct_payment
    id_fields: [payment_id]
    table_synonyms: [payments, payment, receipts, cash_receipts]
    fields:
      payment_id: {type: string, required: true, description: Payment identifier.}
      invoice_id: {type: string, required: true, description: Invoice the payment is applied to.}
      paid_at: {type: timestamp, description: Payment timestamp.}
      amount: {type: decimal, required: true, unit: currency_major, description: Amount received.}
      method: {type: string, description: Payment method.}
      card_number: {type: string, pii: payment_card, description: Full card number (PAN). Never publish.}
      card_last4: {type: string, description: Last four digits of the card.}

  gl_account:
    description: A general-ledger account in the chart of accounts.
    kind: dimension
    mart: dim_gl_account
    id_fields: [account_code]
    table_synonyms: [gl_accounts, accounts_chart, chart_of_accounts, coa, ska1]
    fields:
      account_code: {type: string, required: true, description: GL account code.}
      account_name: {type: string, description: GL account name.}
      account_type: {type: string, required: true, description: "One of revenue, cogs, opex, da, asset, liability, equity."}

  gl_entry:
    description: A general-ledger journal line.
    kind: fact
    mart: fct_gl_entry
    id_fields: [journal_id, line_number]
    table_synonyms: [journal_lines, journal_entries, gl_entries, gl_lines, ledger_entries, bseg]
    lookups:
      - {field: account_type, from_entity: gl_account, join_on: account_code}
    fields:
      journal_id: {type: string, required: true, description: Journal entry identifier.}
      line_number: {type: integer, required: true, description: Line within the journal entry.}
      account_code: {type: string, required: true, description: GL account posted to.}
      posting_date: {type: date, required: true, description: Posting date.}
      debit_amount: {type: decimal, required: true, unit: currency_major, description: Debit amount.}
      credit_amount: {type: decimal, required: true, unit: currency_major, description: Credit amount.}
      entity_code: {type: string, description: Legal entity posted in.}

  vendor:
    description: A supplier.
    kind: dimension
    mart: dim_vendor
    id_fields: [vendor_id]
    table_synonyms: [vendors, vendor, suppliers, supplier, lfa1]
    fields:
      vendor_id: {type: string, required: true, description: Vendor identifier.}
      vendor_name: {type: string, description: Vendor name.}

  employee:
    description: An employee. Identity fields are PII and are hashed or excluded in staging.
    kind: dimension
    mart: dim_employee
    id_fields: [employee_id]
    table_synonyms: [employees, employee, staff, workers, personnel, pa0001]
    fields:
      employee_id: {type: string, required: true, description: Employee identifier.}
      full_name: {type: string, pii: person_name, description: Full name.}
      national_id: {type: string, pii: national_id, description: National identifier (e.g. SSN).}
      date_of_birth: {type: date, pii: dob, description: Date of birth.}
      department: {type: string, description: Department or org unit.}
      hire_date: {type: date, required: true, description: Hire date.}
      termination_date: {type: date, description: Termination date; null if active.}
      salary: {type: decimal, unit: currency_major, description: Annual base salary.}

  department:
    description: An organizational unit.
    kind: dimension
    mart: dim_department
    id_fields: [department_id]
    table_synonyms: [departments, department, org_units]
    fields:
      department_id: {type: string, required: true, description: Department identifier.}
      department_name: {type: string, description: Department name.}

  fiscal_period:
    description: A fiscal period of the portfolio company's calendar.
    kind: dimension
    mart: dim_fiscal_period
    id_fields: [period]
    table_synonyms: [fiscal_periods, periods, calendar, fiscal_calendar]
    fields:
      period: {type: string, required: true, description: Fiscal period label.}
      period_start: {type: date, description: First day of the period.}
      period_end: {type: date, description: Last day of the period.}

