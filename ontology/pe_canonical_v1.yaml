relationships:
  - {from: contact.crm_account_id, to: customer.crm_account_id, cardinality: "N:1"}
  - {from: opportunity.crm_account_id, to: customer.crm_account_id, cardinality: "N:1"}
  - {from: subscription.customer_id, to: customer.customer_id, cardinality: "N:1"}
  - {from: invoice.customer_id, to: customer.customer_id, cardinality: "N:1"}
  - {from: invoice_line.invoice_id, to: invoice.invoice_id, cardinality: "N:1"}
  - {from: invoice_line.sku, to: product.sku, cardinality: "N:1"}
  - {from: payment.invoice_id, to: invoice.invoice_id, cardinality: "N:1"}
  - {from: gl_entry.account_code, to: gl_account.account_code, cardinality: "N:1"}
  - {from: gl_entry.entity_code, to: legal_entity.entity_code, cardinality: "N:1"}

# Column names that look like revenue but usually are not. Mapping them always needs review.
semantic_traps: [rev, revenue, sales, bookings, income, turnover, booked]

metrics:
  billings:
    description: Invoiced amount per month and currency. Billings are not revenue.
    grain: month
    formula: sum(invoice.total_amount) by month(invoice.invoice_date), invoice.currency
    requires: [invoice.total_amount, invoice.invoice_date, invoice.currency]
    semantic: {kind: simple, model: fct_invoice, measure: billings, agg: sum, expr: total_amount, time_dimension: invoice_date}
    pitfall: Billings include prepaid annual invoices; do not present them as recognized revenue.

  mrr:
    description: Monthly recurring revenue from subscriptions active at month end.
    grain: month
    formula: sum(subscription.mrr) where start_date <= month_end < coalesce(end_date, +inf)
    requires: [subscription.mrr, subscription.start_date, subscription.end_date, subscription.currency, subscription.customer_id]
    semantic: {kind: simple, model: fct_mrr_monthly, measure: mrr, agg: sum, expr: mrr, time_dimension: month_end}
    pitfall: Exclude one-time fees; normalize annual contracts to a monthly amount before summing.

  arr:
    description: Annual recurring revenue = 12 x month-end MRR.
    grain: month
    formula: 12 * mrr
    requires: [subscription.mrr, subscription.start_date, subscription.end_date, subscription.currency, subscription.customer_id]
    semantic: {kind: simple, model: fct_mrr_monthly, measure: arr, agg: sum, expr: mrr * 12, time_dimension: month_end}
    pitfall: ARR is not 12 x a single month's billings; prepaid annual contracts break that shortcut.

  active_customers:
    description: Distinct customers with positive MRR at month end.
    grain: month
    formula: count_distinct(customer_id) where mrr > 0 at month end
    requires: [subscription.mrr, subscription.start_date, subscription.end_date, subscription.customer_id]
    semantic: {kind: simple, model: fct_mrr_monthly, measure: active_customers, agg: count_distinct, expr: "case when mrr > 0 then customer_id end", time_dimension: month_end}

  new_arr:
    description: ARR from customers with zero ARR in the prior month.
    grain: month
    formula: sum(12 * mrr_t) for customers with mrr_(t-1) = 0
    requires: [subscription.mrr, subscription.start_date, subscription.end_date, subscription.customer_id]
    semantic: {kind: reference_only}

  expansion_arr:
    description: ARR increase from existing customers.
    grain: month
    formula: sum(12 * (mrr_t - mrr_(t-1))) where both > 0 and mrr_t > mrr_(t-1)
    requires: [subscription.mrr, subscription.start_date, subscription.end_date, subscription.customer_id]
    semantic: {kind: reference_only}

  contraction_arr:
    description: ARR decrease from customers that remain active.
    grain: month
    formula: sum(12 * (mrr_(t-1) - mrr_t)) where both > 0 and mrr_t < mrr_(t-1)
    requires: [subscription.mrr, subscription.start_date, subscription.end_date, subscription.customer_id]
    semantic: {kind: reference_only}

  churned_arr:
    description: ARR lost from customers whose MRR fell to zero.
    grain: month
    formula: sum(12 * mrr_(t-1)) where mrr_t = 0
    requires: [subscription.mrr, subscription.start_date, subscription.end_date, subscription.customer_id]
    semantic: {kind: reference_only}

  nrr:
    description: Net revenue retention over trailing 12 months for the starting cohort.
    grain: month
    formula: sum(arr_t of cohort) / sum(arr_(t-12) of cohort); cohort = customers with arr_(t-12) > 0
    requires: [subscription.mrr, subscription.start_date, subscription.end_date, subscription.customer_id]
    semantic: {kind: reference_only}
    pitfall: Undefined (not zero) when the starting cohort has no ARR.

  grr:
    description: Gross revenue retention over trailing 12 months (expansion capped).
    grain: month
    formula: sum(min(arr_t, arr_(t-12)) of cohort) / sum(arr_(t-12) of cohort)
    requires: [subscription.mrr, subscription.start_date, subscription.end_date, subscription.customer_id]
    semantic: {kind: reference_only}

  revenue_recognized:
    description: Recognized revenue from the general ledger (credits minus debits on revenue accounts).
    grain: month
    formula: sum(credit_amount - debit_amount) where gl_account.account_type = 'revenue'
    requires: [gl_entry.debit_amount, gl_entry.credit_amount, gl_entry.account_code, gl_entry.posting_date, gl_account.account_type]
    semantic: {kind: simple, model: fct_gl_entry, measure: revenue_recognized, agg: sum, expr: "case when account_type = 'revenue' then credit_amount - debit_amount else 0 end", time_dimension: posting_date}
    pitfall: Only GL revenue is recognized revenue; billings and bookings are not substitutes.

  cogs:
    description: Cost of goods sold from the general ledger.
    grain: month
    formula: sum(debit_amount - credit_amount) where account_type = 'cogs'
    requires: [gl_entry.debit_amount, gl_entry.credit_amount, gl_entry.account_code, gl_entry.posting_date, gl_account.account_type]
    semantic: {kind: simple, model: fct_gl_entry, measure: cogs, agg: sum, expr: "case when account_type = 'cogs' then debit_amount - credit_amount else 0 end", time_dimension: posting_date}

  opex:
    description: Operating expenses excluding depreciation and amortization.
    grain: month
    formula: sum(debit_amount - credit_amount) where account_type = 'opex'
    requires: [gl_entry.debit_amount, gl_entry.credit_amount, gl_entry.account_code, gl_entry.posting_date, gl_account.account_type]
    semantic: {kind: simple, model: fct_gl_entry, measure: opex, agg: sum, expr: "case when account_type = 'opex' then debit_amount - credit_amount else 0 end", time_dimension: posting_date}

  gross_margin_pct:
    description: (revenue_recognized - cogs) / revenue_recognized.
    grain: month
    formula: (revenue_recognized - cogs) / revenue_recognized
    requires: [gl_entry.debit_amount, gl_entry.credit_amount, gl_entry.account_code, gl_entry.posting_date, gl_account.account_type]
    semantic: {kind: derived, expr: "(revenue_recognized - cogs) / nullif(revenue_recognized, 0)", depends_on: [revenue_recognized, cogs]}
    pitfall: Undefined when revenue is zero.

  ebitda:
    description: revenue_recognized - cogs - opex (D&A excluded by construction).
    grain: month
    formula: revenue_recognized - cogs - opex
    requires: [gl_entry.debit_amount, gl_entry.credit_amount, gl_entry.account_code, gl_entry.posting_date, gl_account.account_type]
    semantic: {kind: derived, expr: "revenue_recognized - cogs - opex", depends_on: [revenue_recognized, cogs, opex]}
    pitfall: Adjusted EBITDA add-backs are a human judgment and are never generated automatically.

  headcount:
    description: Employees employed at month end.
    grain: month
    formula: count(employee) where hire_date <= month_end and (termination_date is null or termination_date > month_end)
    requires: [employee.employee_id, employee.hire_date, employee.termination_date]
    semantic: {kind: reference_only}

  dso:
    description: Days sales outstanding = open receivables at month end / billings in month * days in month.
    grain: month
    formula: ar_open(month_end) / billings(month) * days_in_month
    requires: [invoice.total_amount, invoice.invoice_date, invoice.invoice_id, payment.amount, payment.paid_at, payment.invoice_id]
    semantic: {kind: reference_only}
    pitfall: Undefined when billings in the month are zero.

  arpa:
    description: Average ARR per active customer.
    grain: month
    formula: arr / active_customers
    requires: [subscription.mrr, subscription.start_date, subscription.end_date, subscription.customer_id]
    semantic: {kind: reference_only}
