# Reviewed update proposals for pinned inputs (audit DEL-03). Pins keep builds reproducible;
# these weekly pull requests keep them from freezing security fixes. Each update goes through
# the full CI gate before merge. Image digests used directly in ci.yml (PostgreSQL service and
# production smoke, Trivy scanner) are not covered by an ecosystem: update them by hand together
# with docker-compose.yml, and keep setup-uv's `version` equal to the Dockerfile's uv image tag.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
